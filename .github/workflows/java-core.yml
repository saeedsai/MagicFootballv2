name: Native Java original-routine checks
on:
  push:
  pull_request:
jobs:
  java-classic-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p build/java
      - run: javac -d build/java java/src/org/magicfootball/classic/*.java java/test/org/magicfootball/classic/*.java
      - run: java -cp build/java org.magicfootball.classic.OriginalRandomTest

      - run: java -cp build/java org.magicfootball.classic.OriginalChrDecoderTest
