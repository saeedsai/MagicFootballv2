name: Bootstrapped browser-source checks
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: node tools/migration-audit.mjs
      - run: node tools/import-audit.mjs
      - run: python -m py_compile tools/browser_weather_sprites_smoke.py
